[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnna-derivation"
version = "0.0.0"
description = "Derived-only CNNA implementation aligned with permanent SOLL identities."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
